name: Atualizar dados do clube

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update:
    if: github.event.issue.user.login == 'udmoreira'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar club-data.json
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re, json
          body=os.environ["BODY"]
          m=re.search(r'<!--UDM-DATA-START-->(.*?)<!--UDM-DATA-END-->', body, re.S)
          if not m:
              raise SystemExit("Dados do clube não encontrados.")
          data=json.loads(m.group(1).strip())
          with open("club-data.json","w",encoding="utf-8") as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
          PY
      - name: Publicar
        run: |
          git config user.name "udmoreira-site"
          git config user.email "actions@github.com"
          git add club-data.json
          git diff --cached --quiet || git commit -m "Atualizar dados do clube"
          git push
      - name: Fechar pedido
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Dados publicados no site."